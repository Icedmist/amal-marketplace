name: Release APK

# Builds a release APK whenever a GitHub Release is published
# (or a version tag is pushed). The APK is attached to that release
# and named with the release tag, e.g. amal-v1.1.0.apk
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for (e.g. v1.1.0). Defaults to the pubspec version.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build APK for release tag
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | cut -d'+' -f1)"
          fi

          if [ -z "$TAG" ]; then
            echo "Could not resolve a release tag" >&2
            exit 1
          fi

          SAFE_TAG="${TAG//\//-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "safe_tag=$SAFE_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Configure release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — APK will be signed with the debug keystore."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          echo "Release signing configured"

      - name: Build release APK
        run: flutter build apk --release

      - name: Name APK with release tag
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          DEST="dist/amal-${{ steps.tag.outputs.safe_tag }}.apk"
          cp "$SRC" "$DEST"
          sha256sum "$DEST" > "$DEST.sha256"
          ls -lh dist
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$DEST.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amal-${{ steps.tag.outputs.safe_tag }}
          path: dist/*
          if-no-files-found: error

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "AMAL $TAG" \
              --generate-notes \
              --verify-tag || \
            gh release create "$TAG" \
              --title "AMAL $TAG" \
              --notes "AMAL Android release $TAG" \
              --target "${{ github.sha }}"
          fi

      - name: Upload APK and checksum to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          APK: ${{ steps.apk.outputs.apk_path }}
          CHECKSUM: ${{ steps.apk.outputs.checksum_path }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$APK" "$CHECKSUM" --clobber
          echo "Uploaded $APK and $CHECKSUM to release $TAG"
