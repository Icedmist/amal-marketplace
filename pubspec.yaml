name: amal_marketplace
description: AMAL — Ahmad Market Link. Nigerian marketplace Flutter app.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.1
  provider: ^6.1.5
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.2
  intl: ^0.20.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/amal-logo.png
    - assets/brand/amal-icon.png
